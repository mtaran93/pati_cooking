server {
    listen 443 ssl;
    http2 on;                       # nginx < 1.25.1: use `listen 443 ssl http2;`
    server_name your-domain.com;    # <-- set your real domain

    root /var/www/html/public;
    index index.php;

    client_max_body_size 260M;   # allow recipe video uploads (iPhone .mov up to 250 MB)

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;      # so Laravel builds https:// URLs
    }
}
