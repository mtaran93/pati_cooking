; Allow large recipe video uploads (iPhone .mov clips up to 250 MB).
; post_max_size is kept a little above upload_max_filesize to leave room for
; the rest of the multipart body. See RecipeForm FileUpload + config/livewire.php.
upload_max_filesize = 250M
post_max_size = 260M

; Large uploads over slow connections need more time to arrive and be parsed.
max_input_time = 300
max_execution_time = 300

; Livewire streams uploads to a temp file, so this need not match the file size.
memory_limit = 256M
