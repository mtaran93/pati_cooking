name: Deploy Production

on:
  release:
    types: [published]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          quoted_release_tag=$(printf '%q' "$RELEASE_TAG")

          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "bash -se -- $quoted_release_tag" << 'EOF'
            set -euo pipefail

            release_tag=$1

            cd /var/html/pati_cooking

            compose() { docker compose -f docker-compose.prod.yml "$@"; }

            git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
            git checkout --detach "refs/tags/$release_tag"
            git reset --hard "refs/tags/$release_tag"

            compose up -d --build
            compose exec -T app composer install \
              --no-dev \
              --prefer-dist \
              --no-interaction \
              --optimize-autoloader
            compose exec -T app php artisan migrate --force
            compose exec -T app php artisan optimize
            compose exec -T app php artisan queue:restart
          EOF
